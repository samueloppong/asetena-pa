services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sheltergh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sheltergh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sheltergh_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sheltergh}
    ports:
      - "5432:5432"
    volumes:
      - sheltergh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sheltergh} -d ${POSTGRES_DB:-sheltergh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: sheltergh-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sheltergh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sheltergh_minio_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sheltergh_minio:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheltergh-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sheltergh}:${POSTGRES_PASSWORD:-sheltergh_dev_password}@db:5432/${POSTGRES_DB:-sheltergh}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-sheltergh-auth-secret-change-me-in-production}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-sheltergh-media}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sheltergh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sheltergh_minio_dev}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    profiles:
      - full

volumes:
  sheltergh_pgdata:
  sheltergh_minio:
